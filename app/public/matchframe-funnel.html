<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchFrame - AI Dating Photos for Men</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0B0B0F; --bgCard:#15151C; --bgEl:#1C1C26;
  --accent:#C9943E; --accentMut:rgba(201,148,62,0.15);
  --text:#F0EBE0; --muted:#8A8690; --dim:#5C5862;
  --red:#E84855; --green:#4ECB71; --border:#2A2A35;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--bg)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}
input::placeholder{color:var(--dim)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fu{animation:fadeUp .6s ease-out both}
.fi{animation:fadeIn .5s ease-out both}

/* Photo placeholder styling */
.photo-placeholder {
  position:relative; overflow:hidden; border-radius:10px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:8px; padding:16px;
  background:transparent !important;
  border:none !important;
}
.photo-placeholder img{
  border:none !important;
  box-shadow:none !important;
  border-radius:10px;
}
.photo-placeholder .label {
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
  padding:4px 12px; border-radius:100px; position:absolute; top:10px; left:10px;
}
.photo-placeholder .desc {
  font-size:13px; line-height:1.5; max-width:200px;
}
.photo-placeholder .swap-note {
  font-size:10px; font-weight:500; opacity:.6; margin-top:4px;
  border-top:1px solid rgba(255,255,255,.1); padding-top:8px; width:100%;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,createElement:h} = React;

/* ─── COLORS shorthand ─── */
const C={bg:"#0B0B0F",bgCard:"#15151C",bgEl:"#1C1C26",accent:"#C9943E",accentMut:"rgba(201,148,62,0.15)",text:"#F0EBE0",muted:"#8A8690",dim:"#5C5862",red:"#E84855",green:"#4ECB71",border:"#2A2A35"};

/* ─── SVG ICONS (inline, no deps) ─── */
const Icon=({name,size=20,color=C.muted})=>{
  const icons={
    check:<polyline points="20 6 9 17 4 12"/>,
    chevronRight:<polyline points="9 18 15 12 9 6"/>,
    chevronDown:<polyline points="6 9 12 15 18 9"/>,

    shield:<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,

    zap:<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
    camera:<><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></>,
    heart:<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>,
    arrowRight:<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>,
    x:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    target:<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
    eye:<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,

    users:<><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></>,
    messageCircle:<><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></>,
    mountain:<><path d="M8 3l4 8 5-5 7 14H0z"/></>,
    user:<><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    bell:<><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></>,
    image:<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>,

    wine:<><path d="M8 22h8M12 18v4M12 2v4"/><path d="M6 6h12l-1 8a5 5 0 01-10 0L6 6z"/></>,
    dumbbell:<><path d="M6.5 6.5h11M6 12h12M6.5 17.5h11"/></>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{icons[name]}</svg>;
};

/* ─── PHOTO PLACEHOLDER / AUTO-IMAGE COMPONENT ─── */
const resolvePhotoSrc=(description="",photoNote="")=>{
  const hay=(String(description)+" "+String(photoNote)).toLowerCase();
  const file=(name)=>encodeURI(`./media/${name}`);

  if (hay.includes("hinge")) return file("hinge screenshot.jpg");
  if (hay.includes("bumble")) return file("bumble ikon.png");
  if (hay.includes("bad") || hay.includes("terrible") || hay.includes("blurry") || hay.includes("worst-case")) return file("bad dating photo example.png");
  if (hay.includes("average") || hay.includes("forgettable")) return file("average dating photo example.JPG");
  if (hay.includes("great") || hay.includes("warm light") || hay.includes("best day")) return file("great dating photo example.JPG");

  return null;
};

const PhotoPlaceholder=({type="before",height=200,description,photoNote,style={},src,showLabel=true,overlayText,objectFit="cover",objectPosition="center"})=>{
  const styles={
    before:{bg:"transparent"},
    after:{bg:"transparent"},
    neutral:{bg:"transparent"},
    hinge:{bg:"transparent"},
    result:{bg:"transparent"},
  };
  const s=styles[type]||styles.neutral;
  const imageSrc = src || resolvePhotoSrc(description, photoNote) || "./media/hero-1.jpg";

  return(
    <div className="photo-placeholder" style={{background:s.bg,height,padding:0,...style}}>
      <img src={imageSrc} alt={description||"MatchFrame visual"} style={{width:"100%",height:"100%",objectFit,objectPosition,display:"block"}}/>
      {overlayText && (
        <span style={{position:"absolute",bottom:8,left:8,right:8,padding:"6px 8px",borderRadius:8,background:"rgba(0,0,0,.62)",color:"#fff",fontSize:11,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",textAlign:"center"}}>{overlayText}</span>
      )}
    </div>
  );
};

/* ─── PRIMITIVES ─── */
const Btn=({children,onClick,variant="primary",size="md",full,disabled,style:st={}})=>{
  const base={display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,border:"none",cursor:disabled?"not-allowed":"pointer",fontFamily:"'Outfit',sans-serif",fontWeight:600,borderRadius:8,transition:"all .2s",opacity:disabled?.5:1,width:full?"100%":"auto",letterSpacing:".02em"};
  const sz={sm:{padding:"10px 20px",fontSize:14},md:{padding:"14px 28px",fontSize:16},lg:{padding:"18px 36px",fontSize:18}};
  const vr={primary:{background:`linear-gradient(135deg,${C.accent},#B8842E)`,color:C.bg},secondary:{background:"transparent",color:C.accent,border:`2px solid ${C.accent}`}};
  return<button onClick={onClick} disabled={disabled} style={{...base,...sz[size],...vr[variant],...st}}>{children}</button>;
};
const Badge=({children})=><span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"6px 14px",borderRadius:100,background:C.accentMut,color:C.accent,fontSize:13,fontWeight:600,letterSpacing:".04em",textTransform:"uppercase"}}>{children}</span>;
const Sec=({children,style:st={},wide})=><section style={{maxWidth:wide?900:720,margin:"0 auto",padding:"60px 24px",...st}}>{children}</section>;
const Heading=({children,size="lg",style:st={}})=>{const s={xl:{fontSize:"clamp(32px,5vw,48px)",lineHeight:1.1},lg:{fontSize:"clamp(24px,4vw,36px)",lineHeight:1.15},md:{fontSize:"clamp(20px,3vw,28px)",lineHeight:1.25}};return<h2 style={{fontFamily:"'Playfair Display',serif",fontWeight:700,color:C.text,...s[size],...st}}>{children}</h2>};
const Divider=()=><div style={{height:1,background:`linear-gradient(90deg,transparent,${C.border},transparent)`,margin:"48px 0"}}/>;

const FaqItem=({q,a})=>{const[o,sO]=useState(false);return<div style={{borderBottom:`1px solid ${C.border}`,padding:"18px 0",cursor:"pointer"}} onClick={()=>sO(!o)}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontWeight:600,fontSize:15,paddingRight:16}}>{q}</span><Icon name="chevronDown" size={18} color={C.accent}/></div>{o&&<p style={{marginTop:12,fontSize:14,lineHeight:1.7,color:C.muted}}>{a}</p>}</div>};

const Timer=()=>{const[t,sT]=useState({h:2,m:47,s:13});useEffect(()=>{const i=setInterval(()=>sT(p=>{let{h,m,s}=p;if(s>0)s--;else if(m>0){m--;s=59}else if(h>0){h--;m=59;s=59}return{h,m,s}}),1000);return()=>clearInterval(i)},[]);const pad=n=>String(n).padStart(2,"0");return<div style={{display:"flex",gap:8,justifyContent:"center"}}>{[["HRS",t.h],["MIN",t.m],["SEC",t.s]].map(([l,v])=><div key={l} style={{background:C.bgEl,borderRadius:8,padding:"8px 14px",textAlign:"center",minWidth:56}}><div style={{fontSize:22,fontWeight:700,fontVariantNumeric:"tabular-nums",color:C.accent}}>{pad(v)}</div><div style={{fontSize:10,color:C.dim,letterSpacing:".1em",marginTop:2}}>{l}</div></div>)}</div>};

const Progress=({step,total})=><div style={{background:C.bgEl,borderRadius:100,height:6,overflow:"hidden",marginBottom:8}}><div style={{height:"100%",width:`${(step/total)*100}%`,background:`linear-gradient(90deg,${C.accent},#DBA94F)`,borderRadius:100,transition:"width .4s ease"}}/></div>;

const TopBar=()=><div style={{padding:"16px 24px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"center",alignItems:"center",gap:10}}><Icon name="target" size={22} color={C.accent}/><span style={{fontWeight:700,fontSize:20,letterSpacing:"-.02em"}}>Match<span style={{color:C.accent}}>Frame</span></span></div>;

/* ─── SOCIAL PROOF COMPONENTS ─── */
const ProofTicker=()=>{
  const items=["2,400+ profiles upgraded","4.8★ average rating","94% say friends couldn't tell","3x avg match increase","24hr delivery","Likeness guaranteed","$19 starting price"];
  return<div style={{background:C.bgEl,borderBottom:`1px solid ${C.border}`,overflow:"hidden",padding:"10px 0"}}><div style={{display:"flex",gap:40,animation:"tickerScroll 25s linear infinite",width:"max-content"}}>{[...items,...items].map((t,i)=><span key={i} style={{fontSize:13,fontWeight:500,color:C.muted,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:6}}><span style={{width:4,height:4,borderRadius:"50%",background:C.accent,flexShrink:0}}/>{t}</span>)}</div></div>;
};

const InlineProof=({quote,name,age,handles,result,avatar})=>(
  <div style={{background:`linear-gradient(135deg,${C.accentMut},rgba(201,148,62,.03))`,border:`1px solid rgba(201,148,62,.2)`,borderRadius:12,padding:"20px 24px",margin:"28px 0",display:"flex",gap:16,alignItems:"flex-start"}}>
    {avatar

      <p style={{fontSize:14,lineHeight:1.65,fontStyle:"italic",marginBottom:10}}>"{quote}"</p>

        <span style={{fontWeight:600,fontSize:13}}>{name}, {age}</span>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {result&&<span style={{fontSize:11,fontWeight:600,color:C.green,background:"rgba(78,203,113,.12)",padding:"3px 10px",borderRadius:100}}>{result}</span>}
          {handles&&<span style={{fontSize:11,fontWeight:500,color:C.accent,background:C.accentMut,padding:"3px 10px",borderRadius:100}}>Handles: {handles}</span>}
        </div>
      </div>
    </div>
  </div>
);

const AvatarStrip=()=>(
  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,flexWrap:"wrap"}}>
    <div style={{display:"flex"}}>{["#E4658C","#8B5CF6","#F59E0B","#10B981","#3B82F6","#EF4444","#6366F1","#14B8A6"].map((col,i)=><div key={i} style={{width:32,height:32,borderRadius:"50%",background:`linear-gradient(135deg,${col},${col}88)`,border:`2px solid ${C.bg}`,marginLeft:i>0?-8:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#fff"}}>{String.fromCharCode(65+i)}</div>)}</div>
    <span style={{fontSize:13,color:C.muted}}>Join <strong style={{color:C.text}}>2,400+</strong> men who upgraded</span>
  </div>
);

function md(text){return text.split(/(\*\*[^*]+\*\*)/g).map((p,i)=>p.startsWith("**")&&p.endsWith("**")?<strong key={i} style={{color:C.accent,fontWeight:700}}>{p.slice(2,-2)}</strong>:<span key={i}>{p}</span>)}


/* ═══════════════════════════════════════════

  const[idx,setIdx]=useState(0);
  const[ans,setAns]=useState({});
  const[email,setEmail]=useState("");
  const tot=STEPS.length+1;
  const qNum=STEPS.slice(0,idx+1).filter(s=>s.type==="q").length;

  const next=()=>{setIdx(idx+1);window.scrollTo({top:0,behavior:"instant"})};
  const pick=v=>{setAns({...ans,[STEPS[idx].id]:v});next()};

  // EMAIL CAPTURE (Step 13)
  if(idx>=STEPS.length){
    return(
      <div style={{minHeight:"100vh",background:C.bg}}>
        <TopBar/>
        <Sec>
          <div className="fu" style={{textAlign:"center"}}>
            <Progress step={tot} total={tot}/>
            <div style={{marginBottom:32}}/>

                    objectFit={isRating ? "cover" : "contain"}
                    objectPosition={isRating ? (i===0 ? "center 14%" : i===1 ? "center 12%" : "center 42%") : "center"}
                    style={isRating ? {fontSize:10,padding:0,background:"transparent",borderRadius:14,overflow:"hidden"} : {fontSize:10,padding:10}}
                  />

          )}
          {s.visual&&s.visual.type==="single"&&(

              <PhotoPlaceholder type="neutral" height={160} description={s.visual.photo.desc} photoNote={s.visual.photo.note}/>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {s.opts.map(o=>(
              <button key={o} onClick={()=>pick(o)}

                {o}<Icon name="chevronRight" size={16} color={C.dim}/>

            ))}
          </div>
        </div>
      </Sec>
    </div>
  );
};
